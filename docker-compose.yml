version: '3'

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000" 
    volumes:
      - ./frontend:/app 
    networks:
      - app-network
    environment:
      - CHOKIDAR_USEPOLLING=true
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
